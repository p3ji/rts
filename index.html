<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingdoms of Wobbleton</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { height: 100%; overflow: hidden; background: #1a2415; font-family: 'Segoe UI', system-ui, sans-serif; color: #f0ead8; }
    #game { position: fixed; inset: 0; display: block; z-index: 0; }
    button { font-family: inherit; }

    /* ---- top bar ---- */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 46px;
      display: flex; align-items: center; gap: 26px; padding: 0 18px;
      background: linear-gradient(to bottom, rgba(24,20,12,0.92), rgba(24,20,12,0.45));
      font-size: 17px; z-index: 5; pointer-events: none;
    }
    #topbar .res { display: flex; gap: 7px; align-items: center; font-weight: 700; letter-spacing: 0.3px; }
    #topbar .res .ico { font-size: 16px; }
    #topbar .res.blocked #res-sup { color: #ff7a66; }
    #topbar .spacer { flex: 1; }
    #age-ind { color: #e8c88a; font-weight: 600; font-size: 15px; }
    #clock { opacity: 0.85; font-variant-numeric: tabular-nums; font-weight: 600; }

    /* ---- bottom HUD ---- */
    #hud {
      position: fixed; left: 0; right: 0; bottom: 0; height: 196px;
      display: flex; gap: 12px; padding: 12px;
      background: linear-gradient(to top, rgba(26,21,12,0.96), rgba(26,21,12,0.8));
      border-top: 2px solid #59492e; z-index: 5;
    }
    #sel-panel { display: flex; gap: 12px; width: 430px; min-width: 430px; }
    #sel-panel .portrait { width: 220px; height: 140px; object-fit: cover; border-radius: 8px; border: 1px solid #6a583a; align-self: center; }
    .sel-info { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .sel-name { font-weight: 700; font-size: 17px; }
    .sel-stats { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13.5px; color: #cdbfa0; }
    .sel-stats .role { color: #a89a78; font-style: italic; }
    .sel-stats .warn { color: #ffd257; font-weight: 600; }
    .sel-desc { font-size: 13px; color: #b3a888; line-height: 1.4; }
    .sel-extra { font-size: 13px; color: #d1c4a4; line-height: 1.4; border-top: 1px solid #4a3d26; padding-top: 5px; }
    .hint { color: #b3a888; font-size: 14.5px; align-self: center; line-height: 1.7; }
    .hint b { color: #e8dcc0; }

    .pbar { width: 100%; max-width: 300px; height: 9px; background: #17120a; border: 1px solid #5a4a2c; border-radius: 5px; overflow: hidden; }
    .pbar > div { height: 100%; background: linear-gradient(to right, #d8a52e, #f0c04a); transition: width 0.2s; }

    /* ---- action buttons ---- */
    #actions { flex: 1; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; overflow-y: auto; padding-right: 4px; }
    .action {
      width: 158px; height: 170px; background: #2a2415; border: 1px solid #5c4c2c; border-radius: 8px;
      color: #f0ead8; cursor: pointer; display: flex; flex-direction: column; align-items: center; padding: 7px; gap: 5px;
      transition: border-color 0.1s, background 0.1s, transform 0.08s;
    }
    .action:hover { border-color: #d8b05c; background: #362e1a; transform: translateY(-2px); }
    .action:active { transform: translateY(0); }
    .action.disabled { opacity: 0.42; cursor: default; }
    .action.disabled:hover { border-color: #5c4c2c; background: #2a2415; transform: none; }
    .action.ageup { border-color: #b08c3c; background: #33290f; }
    .action img { width: 144px; height: 92px; object-fit: cover; border-radius: 5px; pointer-events: none; background: #223018; }
    .action span { font-size: 14px; font-weight: 700; line-height: 1.15; text-align: center; }
    .action small { font-size: 13px; color: #cdbfa0; display: flex; gap: 8px; }
    .c-w { color: #cf9c5e; } .c-g { color: #f0c04a; } .c-p { color: #d1c4a4; }

    .queue { width: 100%; font-size: 14px; color: #cdbfa0; padding: 6px 2px; display: flex; flex-direction: column; gap: 5px; }
    .queue-line b { color: #f0ead8; }
    .queue-line.dim { color: #94886a; font-size: 13px; }

    #minimap { width: 172px; height: 172px; min-width: 172px; border: 2px solid #5c4c2c; border-radius: 8px; cursor: pointer; }

    /* ---- tooltip ---- */
    #tooltip {
      position: fixed; display: none; z-index: 20; max-width: 320px;
      background: rgba(28,22,12,0.97); border: 1px solid #77613a; border-radius: 8px;
      padding: 10px 13px; font-size: 13.5px; line-height: 1.5; pointer-events: none;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }
    #tooltip b { font-size: 14.5px; }
    .tip-role { color: #a89a78; font-style: italic; margin-left: 4px; }
    .tip-desc { color: #cdbfa0; }
    .tip-lock { color: #ffd257; }

    #dragbox { position: fixed; border: 1px solid #7fe86a; background: rgba(127,232,106,0.12); display: none; z-index: 4; pointer-events: none; }

    /* ---- command chat ---- */
    #chatbar {
      position: fixed; left: 50%; bottom: 214px; transform: translateX(-50%);
      display: none; align-items: center; gap: 8px; z-index: 8;
      background: rgba(20,16,9,0.95); border: 1px solid #8a6f3e; border-radius: 9px;
      padding: 9px 14px; width: min(560px, 80vw); box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    #chatbar.open { display: flex; }
    #chatbar .chat-caret { color: #e8c88a; font-size: 18px; font-weight: 800; }
    #chatinput {
      flex: 1; background: transparent; border: none; outline: none;
      color: #f5ecd6; font-size: 16px; font-family: inherit;
    }
    #chatinput::placeholder { color: #8a7c5c; }

    #toast {
      position: fixed; top: 58px; left: 50%; transform: translateX(-50%);
      background: rgba(28,22,12,0.94); border: 1px solid #5c4c2c; padding: 10px 22px; border-radius: 8px;
      font-size: 15px; opacity: 0; transition: opacity 0.25s; z-index: 6; pointer-events: none;
    }
    #toast.show { opacity: 1; }
    #toast.warn { border-color: #c0392b; color: #ffb0a6; }
    #toast.warn.show { opacity: 1; }

    /* ---- overlays ---- */
    .overlay {
      position: fixed; inset: 0; z-index: 10;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: radial-gradient(ellipse at 50% 30%, #3d5a2e 0%, #24361c 55%, #16220f 100%);
    }
    #home h1 {
      font-size: 46px; letter-spacing: 3px; color: #f5e6bc;
      text-shadow: 0 4px 0 #3a2c14, 0 8px 24px rgba(0,0,0,0.55);
    }
    #home .sub { color: #c6d8ae; margin-top: -16px; font-size: 16.5px; }
    .setup-card {
      background: rgba(30,24,13,0.92); border: 2px solid #6a583a; border-radius: 14px;
      padding: 26px 34px; display: flex; flex-direction: column; gap: 20px; min-width: 420px;
      box-shadow: 0 14px 44px rgba(0,0,0,0.45);
    }
    .setup-row { display: flex; flex-direction: column; gap: 9px; }
    .setup-row label { font-size: 14px; color: #cdbfa0; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .optrow { display: flex; gap: 10px; }
    .opt {
      flex: 1; padding: 11px 8px; background: #241d0f; color: #e8dcc0; border: 1px solid #5c4c2c;
      border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.1s;
    }
    .opt:hover { border-color: #a8854a; }
    .opt.sel { background: #4a3a1c; border-color: #d8b05c; color: #ffe9b0; }
    #btn-start {
      padding: 14px; background: linear-gradient(to bottom, #d8a52e, #b8862a); color: #241a06;
      border: none; border-radius: 9px; font-size: 19px; font-weight: 800; letter-spacing: 1px; cursor: pointer;
      box-shadow: 0 4px 0 #6a4c14;
    }
    #btn-start:hover { filter: brightness(1.08); }
    #btn-start:active { transform: translateY(2px); box-shadow: 0 2px 0 #6a4c14; }
    #home .credit { color: #8fa878; font-size: 12.5px; }

    /* ---- mode tabs + online lobby ---- */
    .modetabs { display: flex; gap: 8px; }
    .modetab {
      flex: 1; padding: 9px; background: transparent; color: #cdbfa0; border: 1px solid #5c4c2c;
      border-radius: 8px 8px 0 0; font-size: 14px; font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; cursor: pointer;
    }
    .modetab.sel { background: rgba(30,24,13,0.92); color: #ffe9b0; border-color: #8a6f3e; }
    .online-row { display: flex; gap: 10px; }
    .online-row .opt { flex: 1; }
    #online-relay {
      background: #17130a; border: 1px solid #4a3d26; color: #a89878; border-radius: 6px;
      padding: 7px 9px; font-size: 12px; font-family: inherit; width: 100%;
    }
    .relay-row { display: flex; flex-direction: column; gap: 5px; }
    .relay-row label { font-size: 11px; color: #8a7c5c; letter-spacing: 0.5px; text-transform: uppercase; }
    #join-code {
      background: #17130a; border: 1px solid #5c4c2c; color: #f5ecd6; border-radius: 8px;
      padding: 12px; font-size: 22px; letter-spacing: 6px; text-align: center; font-weight: 800;
      font-family: inherit; text-transform: uppercase;
    }
    #join-code::placeholder { letter-spacing: 3px; font-weight: 400; color: #6a5c40; }
    .lobby-status { display: none; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
    .lobby-status.show { display: flex; }
    .lobby-code {
      font-size: 40px; font-weight: 800; letter-spacing: 10px; color: #ffe9b0;
      background: #17130a; border: 2px dashed #8a6f3e; border-radius: 10px; padding: 14px 22px;
    }
    .lobby-msg { color: #cdbfa0; font-size: 15px; }
    .spinner {
      width: 22px; height: 22px; border: 3px solid #4a3d26; border-top-color: #d8a52e;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #btn-lobby-cancel {
      background: transparent; color: #cdbfa0; border: 1px solid #5c4c2c; padding: 9px 20px;
      border-radius: 7px; font-size: 14px; cursor: pointer;
    }
    #btn-lobby-cancel:hover { border-color: #a8854a; color: #ffe9b0; }

    #loading { z-index: 11; }
    #loading .load-label { font-size: 17px; color: #e8dcc0; }
    #loadbar { width: 340px; height: 14px; background: #17120a; border: 1px solid #5c4c2c; border-radius: 7px; overflow: hidden; }
    #loadbar-fill { height: 100%; width: 0%; background: linear-gradient(to right, #d8a52e, #f0c04a); transition: width 0.15s; }

    #endtitle { font-size: 58px; letter-spacing: 5px; }
    #endtitle.win { color: #a8e86a; text-shadow: 0 0 40px rgba(127,232,106,0.4); }
    #endtitle.loss { color: #ff6a55; text-shadow: 0 0 40px rgba(255,85,68,0.4); }
    #endsub { color: #c6d8ae; font-size: 17px; }
    #endscreen button {
      background: #4a3a1c; color: #f0ead8; border: 1px solid #8a6f3e; padding: 12px 30px;
      border-radius: 8px; font-size: 17px; cursor: pointer;
    }
    #endscreen button:hover { background: #5c4a24; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="topbar">
    <div class="res"><span class="ico">🪵</span><span id="res-w">0</span></div>
    <div class="res"><span class="ico">🪙</span><span id="res-g">0</span></div>
    <div class="res"><span class="ico">👥</span><span id="res-sup">0/0</span></div>
    <div class="spacer"></div>
    <div id="age-ind">Age I — Village Age</div>
    <div id="clock">0:00</div>
  </div>

  <div id="hud">
    <div id="sel-panel"></div>
    <div id="actions"></div>
    <canvas id="minimap" width="172" height="172"></canvas>
  </div>

  <div id="dragbox"></div>
  <div id="toast"></div>
  <div id="tooltip"></div>
  <div id="chatbar"><span class="chat-caret">›</span><input id="chatinput" type="text" autocomplete="off" spellcheck="false" placeholder="type a command and press Enter — try &quot;fog of war&quot;  (Esc to close)"></div>

  <div id="home" class="overlay">
    <h1>KINGDOMS OF WOBBLETON</h1>
    <div class="sub">A cozy boxy real-time strategy · gather, build, age up, conquer</div>

    <div id="mode-tabs" class="modetabs" style="width: 420px;">
      <button class="modetab sel" id="tab-ai">Vs AI</button>
      <button class="modetab" id="tab-online">Online 1v1</button>
    </div>

    <div class="setup-card" id="card-ai">
      <div class="setup-row">
        <label>Rival kingdoms</label>
        <div class="optrow" id="opt-ai"></div>
      </div>
      <div class="setup-row">
        <label>Difficulty</label>
        <div class="optrow" id="opt-diff"></div>
      </div>
      <button id="btn-start">⚔ &nbsp;Start the Match</button>
    </div>

    <div class="setup-card" id="card-online" style="display:none;">
      <div class="setup-row" id="online-choice">
        <label>Play with a friend</label>
        <div class="online-row">
          <button class="opt" id="btn-host">Host a match</button>
          <button class="opt" id="btn-join">Join with code</button>
        </div>
        <div class="relay-row">
          <label>Relay server</label>
          <input id="online-relay" type="text" autocomplete="off" spellcheck="false">
        </div>
      </div>

      <div class="setup-row" id="join-form" style="display:none;">
        <label>Enter room code</label>
        <input id="join-code" type="text" maxlength="4" autocomplete="off" spellcheck="false" placeholder="ABCD">
        <button id="btn-join-confirm" class="opt">Join</button>
      </div>

      <div class="lobby-status" id="lobby-status">
        <div class="spinner"></div>
        <div class="lobby-code" id="lobby-code" style="display:none;"></div>
        <div class="lobby-msg" id="lobby-msg">Connecting…</div>
        <button id="btn-lobby-cancel">Cancel</button>
      </div>
    </div>

    <div class="credit">Models by Quaternius (CC0) · Every match generates a new map</div>
  </div>

  <div id="loading" class="overlay">
    <div class="load-label">Raising the kingdom…</div>
    <div id="loadbar"><div id="loadbar-fill"></div></div>
  </div>

  <div id="endscreen" class="overlay">
    <div id="endtitle"></div>
    <div id="endsub"></div>
    <button onclick="location.reload()">Play Again</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
