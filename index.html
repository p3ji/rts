<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fur &amp; Fury: Tides of Clutter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { height: 100%; overflow: hidden; background: #14181d; font-family: 'Segoe UI', system-ui, sans-serif; color: #e6ecf3; }
    #game { position: fixed; inset: 0; display: block; z-index: 0; }
    button { font-family: inherit; }

    /* ---- top bar ---- */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 46px;
      display: flex; align-items: center; gap: 26px; padding: 0 18px;
      background: linear-gradient(to bottom, rgba(9,12,16,0.94), rgba(9,12,16,0.5));
      font-size: 17px; z-index: 5; pointer-events: none;
    }
    #topbar .res { display: flex; gap: 7px; align-items: center; font-weight: 700; letter-spacing: 0.3px; }
    #topbar .res .ico { font-size: 15px; opacity: 0.9; }
    #topbar .res.blocked #res-sup { color: #ff6655; }
    #topbar .spacer { flex: 1; }
    #clock { opacity: 0.85; font-variant-numeric: tabular-nums; font-weight: 600; }

    /* ---- bottom HUD ---- */
    #hud {
      position: fixed; left: 0; right: 0; bottom: 0; height: 196px;
      display: flex; gap: 12px; padding: 12px;
      background: linear-gradient(to top, rgba(9,12,16,0.96), rgba(9,12,16,0.78));
      border-top: 1px solid #2c3542; z-index: 5;
    }
    #sel-panel { display: flex; gap: 12px; width: 430px; min-width: 430px; }
    #sel-panel .portrait { width: 170px; height: 170px; object-fit: cover; border-radius: 8px; border: 1px solid #3d4a5c; }
    .sel-info { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .sel-name { font-weight: 700; font-size: 17px; }
    .sel-stats { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13.5px; color: #aebfd4; }
    .sel-stats .sh { color: #59c1ff; }
    .sel-stats .role { color: #8b9cb3; font-style: italic; }
    .sel-stats .warn { color: #ffd257; font-weight: 600; }
    .sel-desc { font-size: 13px; color: #93a5bb; line-height: 1.4; }
    .sel-extra { font-size: 13px; color: #b8c6d9; line-height: 1.4; border-top: 1px solid #2c3542; padding-top: 5px; }
    .hint { color: #8b9cb3; font-size: 14.5px; align-self: center; line-height: 1.7; }
    .hint b { color: #c8d4e2; }

    .pbar { width: 100%; max-width: 300px; height: 9px; background: #10151b; border: 1px solid #33404f; border-radius: 5px; overflow: hidden; }
    .pbar > div { height: 100%; background: linear-gradient(to right, #d8a52e, #f0c04a); transition: width 0.2s; }

    /* ---- action buttons ---- */
    #actions { flex: 1; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; overflow-y: auto; padding-right: 4px; }
    .action {
      width: 158px; height: 170px; background: #1e2631; border: 1px solid #3a4757; border-radius: 8px;
      color: #e6ecf3; cursor: pointer; display: flex; flex-direction: column; align-items: center; padding: 7px; gap: 5px;
      transition: border-color 0.1s, background 0.1s, transform 0.08s;
    }
    .action:hover { border-color: #6fa7e8; background: #253141; transform: translateY(-2px); }
    .action:active { transform: translateY(0); }
    .action.disabled { opacity: 0.42; cursor: default; }
    .action.disabled:hover { border-color: #3a4757; background: #1e2631; transform: none; }
    .action img { width: 144px; height: 92px; object-fit: cover; border-radius: 5px; pointer-events: none; }
    .action span { font-size: 14px; font-weight: 700; line-height: 1.15; text-align: center; }
    .action small { font-size: 13px; color: #a3b4c9; display: flex; gap: 8px; }
    .c-s { color: #7fd7e8; } .c-z { color: #f0a83a; } .c-p { color: #b8c6d9; }

    .queue { width: 100%; font-size: 14px; color: #aebfd4; padding: 6px 2px; display: flex; flex-direction: column; gap: 5px; }
    .queue-line b { color: #e6ecf3; }
    .queue-line.dim { color: #7e8fa4; font-size: 13px; }

    #minimap { width: 172px; height: 172px; min-width: 172px; border: 1px solid #3a4757; border-radius: 8px; cursor: pointer; }

    /* ---- tooltip ---- */
    #tooltip {
      position: fixed; display: none; z-index: 20; max-width: 320px;
      background: rgba(13,18,24,0.97); border: 1px solid #46586e; border-radius: 8px;
      padding: 10px 13px; font-size: 13.5px; line-height: 1.5; pointer-events: none;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }
    #tooltip b { font-size: 14.5px; }
    .tip-role { color: #8b9cb3; font-style: italic; margin-left: 4px; }
    .tip-desc { color: #a3b4c9; }
    .tip-lock { color: #ffd257; }

    #dragbox { position: fixed; border: 1px solid #4dff88; background: rgba(77,255,136,0.12); display: none; z-index: 4; pointer-events: none; }

    #toast {
      position: fixed; top: 58px; left: 50%; transform: translateX(-50%);
      background: rgba(14,19,26,0.94); border: 1px solid #3a4757; padding: 10px 22px; border-radius: 8px;
      font-size: 15px; opacity: 0; transition: opacity 0.25s; z-index: 6; pointer-events: none;
    }
    #toast.show { opacity: 1; }
    #toast.warn { border-color: #c0392b; color: #ffb0a6; }
    #toast.warn.show { opacity: 1; }

    /* ---- overlays ---- */
    .overlay {
      position: fixed; inset: 0; background: rgba(7,10,14,0.92); z-index: 10;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    }
    #factionpick h1 { font-size: 38px; letter-spacing: 2px; text-shadow: 0 3px 14px rgba(0,0,0,0.6); }
    #factionpick .sub { color: #93a5bb; margin-top: -20px; font-size: 16px; }
    #factiongrid { display: flex; gap: 22px; }
    .fcard {
      width: 280px; background: #1b232d; border: 1px solid #3a4757; border-radius: 12px; padding: 16px;
      color: #e6ecf3; cursor: pointer; text-align: left; transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
    }
    .fcard:hover { transform: translateY(-5px); border-color: #6fa7e8; box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
    .fcard img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
    .fcard h3 { margin: 12px 0 7px; font-size: 19px; }
    .fcard p { font-size: 13.5px; color: #93a5bb; line-height: 1.45; }

    #endtitle { font-size: 58px; letter-spacing: 5px; }
    #endtitle.win { color: #4dff88; text-shadow: 0 0 40px rgba(77,255,136,0.4); }
    #endtitle.loss { color: #ff5544; text-shadow: 0 0 40px rgba(255,85,68,0.4); }
    #endsub { color: #93a5bb; font-size: 17px; }
    #endscreen button {
      background: #2a3542; color: #e6ecf3; border: 1px solid #4a5a6e; padding: 12px 30px;
      border-radius: 8px; font-size: 17px; cursor: pointer;
    }
    #endscreen button:hover { background: #35455a; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="topbar">
    <div class="res"><span class="ico">◆</span><span id="res-s">0</span></div>
    <div class="res"><span class="ico">🍊</span><span id="res-z">0</span></div>
    <div class="res"><span class="ico">👥</span><span id="res-sup">0/0</span></div>
    <div class="spacer"></div>
    <div id="clock">0:00</div>
  </div>

  <div id="hud">
    <div id="sel-panel"></div>
    <div id="actions"></div>
    <canvas id="minimap" width="172" height="172"></canvas>
  </div>

  <div id="dragbox"></div>
  <div id="toast"></div>
  <div id="tooltip"></div>

  <div id="factionpick" class="overlay">
    <h1>FUR &amp; FURY: TIDES OF CLUTTER</h1>
    <div class="sub">Choose your faction · destroy the enemy town hall</div>
    <div id="factiongrid"></div>
  </div>

  <div id="endscreen" class="overlay">
    <div id="endtitle"></div>
    <div id="endsub"></div>
    <button onclick="location.reload()">Play Again</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
